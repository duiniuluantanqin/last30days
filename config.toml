[source]
list_url = "https://t66y.com/thread0806.php?fid=7"
timezone = "Asia/Shanghai"
request_interval_seconds = 2.0
timeout_seconds = 25
retries = 2
max_response_bytes = 4000000
respect_robots = true
user_agent = "ForumArchive/0.1 (personal text archive; no image downloads)"

[crawl]
initial_days = 30
overlap_hours = 48
recent_pages_per_run = 5
backfill_pages_per_run = 5
max_posts_per_run = 60
max_attempts = 3

[filter]
# Keywords and patterns match titles and full body text, not HTML attributes.
# Customize them for your own inclusion criteria. Images are NOT classified.
# Local keywords: blacklist/keywords.txt (one keyword per line).
blocked_patterns = []
keyword_files = [
    "third_party/multilingual-sensitive-words/data/sensitive-words/sw_色情类.txt",
    "third_party/multilingual-sensitive-words/data/sensitive-words/sw_广告.txt",
]

[site]
title = "拾页"
subtitle = "技术讨论 · 每小时更新"
description = "把值得阅读的讨论，留在这里。"
page_size = 20
# Readers confirm changes on GitHub; no browser token or backend is needed.
github_repository = "duiniuluantanqin/last30days"
github_branch = "master"

[storage]
database = "data/archive.sqlite3"
output = "site"
