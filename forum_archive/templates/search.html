{% extends "base.html" %}
{% block title %}搜索讨论 · {{ site.title }}{% endblock %}
{% block content %}
<section class="page-heading"><div><p class="eyebrow">全文搜索</p><h1>搜索讨论<span class="heading-dot">。</span></h1></div></section>
<p id="search-status" role="status" aria-live="polite">正在加载搜索…</p>
<div class="article-list" id="search-results" hidden></div>
<section class="empty-state" id="search-empty" hidden><h2>没有找到相关讨论</h2><p>试试其他关键词。</p></section>
{% include "pagination.html" %}
<template id="search-result-template">
  <article class="article-row">
    <div class="article-info"><h2><a></a><span class="new-badge" title="最近一次爬取新增" aria-label="最近一次爬取新增">NEW</span></h2><p class="excerpt"></p><div class="article-meta"><span>技术讨论</span><span class="result-images"></span><time class="article-date"></time></div></div>
  </article>
</template>
<noscript><p>请启用 JavaScript 后搜索标题和正文，或<a href="{{ base_path }}/">返回文章列表</a>。</p></noscript>
{% endblock %}
{% block scripts %}
<script src="{{ base_path }}/assets/search-index.js?v={{ asset_version }}" defer></script>
<script src="{{ base_path }}/assets/search.js" defer></script>
{% endblock %}
