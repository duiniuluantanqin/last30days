name: Hourly archive
on:
  push:
    branches:
      - master
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: forum-archive-publish
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      DEPLOY_ROOT: ${{ vars.DEPLOY_ROOT || '/var/www/html/last30days' }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e .
      - name: Merge keyword files and save consolidated blacklist
        if: github.ref_name == github.event.repository.default_branch
        shell: bash
        run: |
          python scripts/merge_blacklist.py
          if git diff --quiet -- blacklist; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all -- 'blacklist/*.txt'
          git commit -m 'Consolidate blacklist keywords'
          git push origin HEAD:"$GITHUB_REF_NAME"
      - name: Restore authoritative state from ECS
        run: python scripts/remote.py restore
      - name: Apply blacklist and 30-day retention and save database
        run: |
          python -m forum_archive build
          python scripts/remote.py save-state
      - name: Collect posts (partial failures are retried next time)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        id: crawl
        shell: bash
        run: |
          result=0
          python -m forum_archive crawl || result=$?
          if [ "$result" -ne 0 ] && [ "$result" -ne 2 ]; then
            exit "$result"
          fi
          echo "result=$result" >> "$GITHUB_OUTPUT"
      - name: Reapply rules and build locally (no ECS website upload)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python -m forum_archive build
      - name: Save collected database to ECS
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python scripts/remote.py save-state
      - name: Report partial collection failures
        if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && steps.crawl.outputs.result == '2'
        run: |
          echo "::error::部分帖子采集失败；成功内容和重试状态已保存到 ECS 数据库，GitHub Pages 将继续发布已有内容，下一轮继续采集。"
          exit 1
