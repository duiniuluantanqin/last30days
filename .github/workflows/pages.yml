name: Publish GitHub Pages
on:
  workflow_run:
    workflows: [Hourly archive]
    branches: [master]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: forum-archive-pages
  cancel-in-progress: false
jobs:
  build:
    if: github.event_name == 'workflow_run' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e .
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Read archive snapshot from ECS
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_ROOT: ${{ vars.DEPLOY_ROOT || '/var/www/html/last30days' }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
        run: |
          python scripts/remote.py restore
          python -c "from forum_archive.config import Settings; assert Settings.load().database.is_file(), 'ECS archive is missing; run Hourly archive first'"
      - name: Build public Pages release
        id: release
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        shell: bash
        run: |
          python -m forum_archive build --base-path "$PAGES_BASE_PATH" --path-file .cache/pages-release.txt
          echo "path=$(cat .cache/pages-release.txt)" >> "$GITHUB_OUTPUT"
      - name: Upload public files only
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.release.outputs.path }}
          retention-days: 1
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
