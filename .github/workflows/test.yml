name: Test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Update sensitive word lists from upstream main
        run: |
          git submodule update --init --remote --depth 1 -- third_party/multilingual-sensitive-words
          git -C third_party/multilingual-sensitive-words rev-parse HEAD
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: python -m forum_archive demo
