name: Block keyword PR
on:
  issues:
    types: [opened]
permissions: {}
concurrency:
  group: block-keyword-${{ github.event.issue.number }}
  cancel-in-progress: false
jobs:
  propose:
    if: startsWith(github.event.issue.title, '[Block] ')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      issues: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.BLOCK_PR_TOKEN || github.token }}
          script: |
            const createKeywordPR = require('./scripts/block-keyword-pr.cjs');
            await createKeywordPR({github, context, core});
